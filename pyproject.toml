[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasscheck"
version = "0.1.0"
description = "A tiny, transparent, offline AI that gets people outside"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "void389"}]

[project.scripts]
grasscheck = "grasscheck.cli:main"

[tool.setuptools.package-data]
grasscheck = ["data/*.json", "data/*.csv"]
